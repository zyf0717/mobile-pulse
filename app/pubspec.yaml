name: mobile_pulse
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  # The 2026 Stack
  flutter_riverpod: ^3.0.0    # Best-in-class state management
  fl_chart: ^0.70.0           # For your telemetry graphs
  http: ^1.2.0                # Talk to your RPi server
  intl: ^0.19.0               # Date/Time formatting
  json_annotation: ^4.9.0     # Clean data models
  geolocator: ^14.0.2
  polar: ^7.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.0        # Generates boilerplate for models
  json_serializable: ^6.8.0
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
